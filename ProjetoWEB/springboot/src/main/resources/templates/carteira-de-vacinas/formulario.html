<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Sistema de Saúde</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<style>
        body {
          padding-top: 4.5rem;
        }
        .time {
         font-size: 1.0em;
         font-weight: bold;
         text-align: center;
         margin-bottom: 20px;
         color: white;
      }
    </style>
</head>
<body>
   <div th:replace="fragments/menu :: menu"></div>

	<div class="container">
		<div class="bg-light p-5 rounded">
			<h1>Carteira de Vacinação do Paciente</h1>
			<hr>
			<div>
				<form th:action="@{/carteira-de-vacinas}" method="POST">
					<input id="id" type="hidden" th:field="*{carteiraDeVacinas.id}"/>
					<div th:if="${!#strings.isEmpty(feedback)}" class="alert alert-success" role="alert">
	  					<span th:text="${feedback}"></span>
					</div>
					<div class="row">
						<div class="col-4 mb-3">						 
							<label class="form-label" for="paciente">Paciente</label>
			 				<input  class="form-control" id="paciente" th:field="*{carteiraDeVacinas.paciente.id}"  type="hidden"/>
				 			<input  class="form-control" id="paciente" th:field="*{carteiraDeVacinas.paciente.nome}" type="text" readonly/>
							<span style="color: red" th:if="${#fields.hasErrors('carteiraDeVacinas.paciente')}" th:errors="*{carteiraDeVacinas.paciente}"></span>
						</div>					
						<div class="col-4 mb-3">						 
							<label class="form-label" for="paciente">Nome da Mãe</label>
			 				<input  class="form-control" id="paciente" th:field="*{carteiraDeVacinas.paciente.id}"  type="hidden"/>
				 			<input  class="form-control" id="paciente" th:field="*{carteiraDeVacinas.paciente.nomeDaMae}" type="text" readonly/>
							<span style="color: red" th:if="${#fields.hasErrors('carteiraDeVacinas.paciente.nomeDaMae')}" th:errors="*{carteiraDeVacinas.paciente.nomeDaMae}"></span>
						</div>	
 						<div class="col-4 mb-3">
							<label class="form-label" for="dataHora">Data de nascimento</label>
							<input type="text" th:value="${#temporals.format(carteiraDeVacinas.paciente.dataDeNascimento, 'dd/MM/yyyy')}"  class="form-control"  readonly />

							<span style="color: red" th:if="${#fields.hasErrors('carteiraDeVacinas.paciente.dataDeNascimento')}" th:errors="*{carteiraDeVacinas.paciente.dataDeNascimento}"></span>
					
						</div> 
					<div th:replace="fragments/carteiradevacina :: carteiradevacina"></div>
					</div>
					<div th:if="${carteiraDeVacinas.id != null}" class="mb-3">
						<a class="btn btn-sm btn-success" th:href="@{/carteira-de-vacinas/{id}/item(id=${carteiraDeVacinas.id})}">Adicionar vacina aplicada</a>
						<table class="table table-hover">
						    <thead>
						        <tr>
						            <td><b>VACINA</b></td>
						            <td><b>DOSE</b></td>
									<td><b>DATA DA APLICAÇÃO</b></td>
									<td><b>MARCA</b></td>
									<td><b>FUNCIONÁRIO</b></td>
									<td></td>
						        </tr>
						    </thead>
						    <tbody>
						        <tr th:each="item : ${carteiraDeVacinas.itens}">
						          <td th:text="${item.produtoEstoque.getProduto().getNome()}"></td>
						            <td th:text="${item.quantidade}"></td>						             
						            <td th:text="${#temporals.format(item.dataHora, 'dd/MM/yyyy HH:mm')}"></td>	
						            <td  th:text="${item.produtoEstoque.getMarca().getDescricao()}"></td>	
						            <td  th:text="${item.getFuncionario().getNome()}"></td>					           
						            <td>
						            	<a class="btn btn-sm btn-secondary" th:href="@{/dose-vacina-item/remove/{id}(id=${item.id})}">Remover</a>
						            </td>
						       </tr>
						     </tbody>
						</table>
					</div>					
					<div class="mb-3">
						<input class="btn btn-primary" type="submit" value="Salvar"/>
					</div>
				</form>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js" integrity="sha512-894YE6QWD5I59HgZOGReFYm4dnWc1Qt5NtvYSaNcOP+u1T9qYdvdihz0PPSiiqn/+/3e7Jo4EaG7TubfWGUrMQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script>
      var timeDisplay = document.getElementById("time");

      function refreshTime() {
         console.log("JavaScript carregado e executando!");
         var dateString = new Date().toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo" });
         var formattedString = dateString.replace(", ", " - ");
         timeDisplay.innerHTML = formattedString;
      }

      setInterval(refreshTime, 1000);
   </script>
<div th:replace="fragments/footer :: footer"></div>
</body>

</html>
