<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Saúde</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            padding-top: 4.5rem;
        }
        .time {
         font-size: 1.0em;
         font-weight: bold;
         text-align: center;
         margin-bottom: 20px;
         color: white;
      }
    </style>
</head>
<body>
    <div th:replace="fragments/menu :: menu"></div>
    <div class="container">
        <div class="bg-light p-5 rounded">
            <h1>Adicionar vacina aplicada</h1>
            <hr>
            <div>
                <form th:action="@{/dose-vacina-item}" th:object="${doseVacinaItem}" method="POST">
                    <input id="id" type="hidden" th:field="*{id}"/>
                    <div th:if="${mensagemErro}" class="alert alert-warning" role="alert">
   					 	<i class="bi bi-exclamation-triangle-fill"></i>
   					 	<span th:text="${mensagemErro}"></span>
					</div>
                  
                    <div class="row">
                        <h5>Dados do paciente</h5>
                        <div class="col-2 mb-3">
                            <label class="form-label" for="carteiraDeVacinas">Número</label>
                            <input class="form-control" id="carteiraDeVacinas" th:field="*{carteiraDeVacinas.id}" type="text" readonly/>
                        </div>
                        <div class="col-4 mb-3">
                            <label class="form-label" for="paciente">Paciente</label>
                            <input class="form-control" id="paciente" th:field="*{carteiraDeVacinas.paciente.nome}" type="text" readonly/>
                        </div>
                    </div>
                    <br />
                    <div class="row">
                        <h5>Dados da Vacina aplicada</h5>
                        <div class="col-6 mb-3">
                            <label class="form-label" for="produtoEstoque">Vacina</label>
                            <select class="form-select" id="produtoEstoque" th:field="*{produtoEstoque.id}">
                                <option value="">Selecione a vacina</option>
                               <!--  <option th:each="produto : ${produtoEstoque}" th:if="${produtoEstoque.ativo}" th:value="${produtoEstoque.id}" th:text="${produtoEstoque.nome}"></option> -->
                                <option th:each="produto : ${produtoEstoque}" th:if="${produto.quantidade > 0}" th:value="${produto.id}" th:text="${produto.nome}"> </option>
                            </select>
                            <span style="color: red" th:if="${#fields.hasErrors('produtoEstoque')}" th:errors="*{produtoEstoque}"></span>
                        </div>                       
                        <div class="col-4 mb-3">
                            <label class="form-label" for="dataHora">Data da aplicação</label>
                            <input class="form-control" id="dataHora" type="datetime-local" th:field="*{dataHora}"/>
                            <span style="color: red" th:if="${#fields.hasErrors('dataHora')}" th:errors="*{dataHora}"></span>
                        </div>                        
                        <div class="col-4 mb-3">
                            <label class="form-label" for="funcionario">Funcionário</label>
                            <select class="form-select" id="funcionario" th:field="*{funcionario.id}">
                                <option value="">Selecione um funcionário</option>
                                <option th:each="funcionario : ${funcionarios}" th:if="${funcionario.ativo}" th:value="${funcionario.id}" th:text="${funcionario.nome}"></option>
                            </select>
                            <span style="color: red" th:if="${#fields.hasErrors('funcionario')}" th:errors="*{funcionario}"></span>
                        </div>
                    </div>
                    <div class="mb-3">
                        <input class="btn btn-primary" type="submit" value="Salvar"/>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
    <script>  
 
        
        // Função para formatar a data e hora no formato adequado para datetime-local
        function setCurrentDateTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0'); // Mês é zero-indexado
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');

            const datetimeLocal = `${year}-${month}-${day}T${hours}:${minutes}`;
            document.getElementById('dataHora').value = datetimeLocal;
        }
        
       


        // Chama a função ao carregar a página             
        window.onload = setCurrentDateTime(); // Sua função existente             
        

       
    </script>
    <script>
      var timeDisplay = document.getElementById("time");

      function refreshTime() {
         console.log("JavaScript carregado e executando!");
         var dateString = new Date().toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo" });
         var formattedString = dateString.replace(", ", " - ");
         timeDisplay.innerHTML = formattedString;
      }

      setInterval(refreshTime, 1000);
   </script>
   <div th:replace="fragments/footer :: footer"></div>
</body>

</html>
