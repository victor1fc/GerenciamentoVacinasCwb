<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Sistema de Saúde</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<style>
		body {
			padding-top: 4.5rem;
		}
		.time {
         font-size: 1.0em;
         font-weight: bold;
         text-align: center;
         margin-bottom: 20px;
         color: white;
      }
    </style>
</head>
<body>
   <div th:replace="fragments/menu :: menu"></div>
	<div class="container">
		<div class="bg-light p-5 rounded">
			<h1>Dados da Vacina</h1>
			<hr>
			<div>
				<form th:action="@{/estoque}" th:object="${produtoEstoque}" method="POST">
					<input id="ativo" type="hidden" th:field="*{id}"/>					
					<div class="row">
						<div class="col-3 mb-3">
							<label class="form-label" for="produto">Tipo de Vacina</label>
							<select class="form-select" id="produto" th:field="*{produto.id}">
								<option value="">Selecione um produto</option>
								<option th:each="produto : ${produtos}" th:value="${produto.id}"
									th:text="${produto.nome}"></option>
							</select>
							<span style="color: red" th:if="${#fields.hasErrors('produto')}" th:errors="*{produto}"></span>
						</div>
			 			<div class="col-4 mb-3">
							<label class="form-label" for="marca">Marca</label>
							<select class="form-select" id="marca" th:field="*{marca}">
								<option value="">Selecione uma marca</option>
								<option th:each="marca : ${marcas}" th:value="${marca}" th:text="${marca.getDescricao()}"></option>
							</select>
							<span style="color: red" th:if="${#fields.hasErrors('marca')}" th:errors="*{marca}"></span>
						</div> 
						<div class="col-2 mb-3">
							<label class="form-label" for="numeroDoLote">Nº do lote</label>
							<input class="form-control" id="numeroDoLote" th:field="*{numeroDoLote}" type="number"/>
							<span style="color: red" th:if="${#fields.hasErrors('numeroDoLote')}"
					      	th:errors="*{numeroDoLote}"></span>
						</div>
						<div class="col-4 mb-3">
							<label class="form-label" for="dataDeValidade">Data de Validade</label>
							<input class="form-control" id="dataDeValidade" type="date" th:field="*{dataDeValidade}" />
							<span style="color: red" th:if="${#fields.hasErrors('dataDeValidade')}" th:errors="*{dataDeValidade}"></span>
						</div>
						<div class="col-2 mb-3">
							<label class="form-label" for="quantidade">Qtde</label>
							<input class="form-control" id="quantidade" th:field="*{quantidade}" type="number"/>
							<span style="color: red" th:if="${#fields.hasErrors('quantidade')}"
					      	th:errors="*{quantidade}"></span>
						</div>
					</div>
					<div class="mb-3">
						<input class="btn btn-primary" type="submit" value="Salvar"/>
					</div>
				</form>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
			crossorigin="anonymous"></script>
			<script>
      var timeDisplay = document.getElementById("time");

      function refreshTime() {
         console.log("JavaScript carregado e executando!");
         var dateString = new Date().toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo" });
         var formattedString = dateString.replace(", ", " - ");
         timeDisplay.innerHTML = formattedString;
      }

      setInterval(refreshTime, 1000);
   </script>
   <div th:replace="fragments/footer :: footer"></div>
</body>

</html>
