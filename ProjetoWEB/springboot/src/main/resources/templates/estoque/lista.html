<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Sistema de Saúde</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<style>
        body {
          padding-top: 4.5rem;
        }
        .time {
         font-size: 1.0em;
         font-weight: bold;
         text-align: center;
         margin-bottom: 20px;
         color: white;
      }
    </style>
</head>
<body>
	<div th:replace="fragments/menu :: menu"></div>

	<div class="container">
		<div class="bg-light p-5 rounded">
			<h1>Estoque</h1>
			<hr>
			<div>
				<a class="btn btn-primary" th:href="@{/estoque/novo}">Novo</a>
			</div>
			<hr>			
			<table id="table" class="table table-hover">
			    <thead id="thead">
			        <tr>
			            <td><b>TIPO DE VACINA</b></td>			            
			            <td><b>MARCA</b></td>
			            <td><b>Nº DO LOTE</b></td>
			            <td><b>DATA DE VALIDADE</b></td>
			            <td><b>QUANTIDADE</b></td>
			        </tr>
			    </thead>
			    <tbody id="tbody">
			     </tbody>
			</table>
		</div>
	</div>
	
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js" integrity="sha512-894YE6QWD5I59HgZOGReFYm4dnWc1Qt5NtvYSaNcOP+u1T9qYdvdihz0PPSiiqn/+/3e7Jo4EaG7TubfWGUrMQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

	<script src="https://cdn.jsdelivr.net/npm/moment@2.29.1/moment.min.js"></script>
	<script>
		$(document).ready(function() {
			$.ajax({
				method: "GET",
				url: "http://localhost:8081/api/estoque",
			}).done(function(data) {
				for(var i = 0; i < data.length; i++) {					
					var dataFormatada = moment(data[i].dataDeValidade).format('DD/MM/YYYY');					
					$("#tbody").append("<tr><td>" + data[i].produto.nome + "</td><td>" + data[i].marca + "</td><td>" + data[i].numeroDoLote + "</td><td>" + dataFormatada + "</td><td>" + data[i].quantidade + "</td></tr>");
				}
			});
		});
	</script>

	<script>
      var timeDisplay = document.getElementById("time");

      function refreshTime() {
         console.log("JavaScript carregado e executando!");
         var dateString = new Date().toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo" });
         var formattedString = dateString.replace(", ", " - ");
         timeDisplay.innerHTML = formattedString;
      }

      setInterval(refreshTime, 1000);
   </script>
   <div th:replace="fragments/footer :: footer"></div>
</body>

</html>
