<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Sistema de Saúde</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	
</head>
<body>
<nav th:fragment="footer">
<footer class="bg-body-tertiary text-center">
  <div th:if="${#httpServletRequest.requestURI == '/'}" class="container p-4 pb-0">
    <section class="mb-4">
      <!-- Facebook -->
      <a
        class="btn text-white btn-floating m-1"
        style="background-color: #3b5998; border-radius: 50%;"
        href="#!"
        role="button"
        ><i class="bi bi-facebook"></i></a>    

      <!-- Google -->
      <a
        class="btn text-white btn-floating m-1"
        style="background-color: #dd4b39; border-radius: 50%;"
        href="#!"
        role="button"
        ><i class="bi bi-google"></i></a>

      <!-- Instagram -->
      <a
        class="btn text-white btn-floating m-1"
        style="background-color: #ac2bac; border-radius: 50%;"
        href="#!"
        role="button"
        ><i class="bi bi-instagram"></i></a>

      <!-- Linkedin -->
      <a
        class="btn text-white btn-floating m-1"
        style="background-color: #0082ca; border-radius: 50%;"
        href="#!"
        role="button"
        ><i class="bi bi-linkedin"></i></a>
      
      <!-- Github -->
      <a
        class="btn text-white btn-floating m-1"
        style="background-color: #333333; border-radius: 50%;"
        href="https://www.github.com/victor1fc/"
        role="button"      >
		<i class="bi bi-github"></i>
	</a>
    </section>
  </div>
  <div class="text-center p-3" style="background-color: rgba(0, 0, 0, 0.05);">
    © 2025 Desenvolvido por:
    <a class="text-body" href="">Victor F. Campos</a>
  </div>
</footer>
</nav>
<!-- Script do Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
