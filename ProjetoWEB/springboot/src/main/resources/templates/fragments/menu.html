<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
   <head>
      <meta charset="UTF-8">
      <title>Sistema de Saúde</title>
      <link rel="canonical" href="https://getbootstrap.com/docs/5.1/examples/navbar-fixed/">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
      <style>
         body {
            padding-top: 4.5rem;
         }  
         .time {
        		 font-size: 1.0em;
         		 font-weight: bold;
        		 text-align: center;
         		 margin-bottom: 20px;
        		 color: white;
      	}        	
		
          
      </style>
   </head>
   <body>
      <nav th:fragment="menu" class="navbar navbar-inverse navbar-expand-md navbar-dark fixed-top bg-dark">
         <div class="container-fluid">
            <a href="/" class="navbar-brand d-flex align-items-center">
   			 	<img src="/images/logo.png" alt="Logo" style="width:40px;" class="rounded-pill">    			
    			<span style="padding: 5px 10px; margin-left: 1px; margin-right: 10px; display: inline-block; line-height: 1;">
        		<b>Sistema de Saúde</b>
   				 </span> 
			</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
               <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
               <ul class="navbar-nav me-auto mb-2 mb-md-0">
                  <li class="nav-item">
                     <a class="nav-link active"  aria-current="page" href="/produtos">Vacinas</a> 
                  </li>
                  <li class="nav-item">
                 	 <a class="nav-link " href="/estoque">Estoque</a>
               	  </li>               	  
                  <li class="nav-item">
                     <a class="nav-link " href="/pacientes">Pacientes</a>
                  </li>
                  <li class="nav-item">
                     <a class="nav-link " href="/funcionarios">Funcionários</a>
                  </li>
                  <li class="nav-item">
                     <a class="nav-link " href="/carteira-de-vacinas">Carteira de Vacinação</a>
                  </li>
                  <li class="nav-item">
                 	 <a class="nav-link " href="/historico">Histórico</a>
               	  </li>
                  <li class="nav-item">
                     <a class="nav-link " href="/logout">Sair</a>
                  </li>
               </ul>  
               <div th:replace="fragments/time :: time"></div>              
            </div>
         </div>        
      </nav>
      <div class="container">
         <div class="bg-light p-5 rounded">
            <h1>Página inicial</h1>            
            <p class="lead">Seja bem-vindo ao Sistema de Vacinas</p>
         </div>
      </div>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>  
     <script>
      var timeDisplay = document.getElementById("time");

      function refreshTime() {
         console.log("JavaScript carregado e executando!");
         var dateString = new Date().toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo" });
         var formattedString = dateString.replace(", ", " - ");
         timeDisplay.innerHTML = formattedString;
      }

      setInterval(refreshTime, 1000);
   </script>
   </body>
</html>
