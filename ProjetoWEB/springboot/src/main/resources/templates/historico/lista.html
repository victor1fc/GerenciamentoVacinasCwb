<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Sistema de Saúde</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
	crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
body {
	padding-top: 4.5rem;
}

.time {
	font-size: 1.0em;
	font-weight: bold;
	text-align: center;
	margin-bottom: 20px;
	color: white;
}
</style>
</head>
<body>
	<div th:replace="fragments/menu :: menu"></div>
	<div class="container">
		<div class="bg-light p-5 rounded">
			<h1>Histórico de Aplicações de Vacinas</h1>
			<hr>
			<div th:if="${!#strings.isEmpty(feedback)}"
				class="alert alert-success" role="alert">
				<span th:text="${feedback}"></span>
			</div>
			<table class="table table-striped table-bordered">
				<thead>
					<tr>
						<td class="text-center"><b>PACIENTE</b></td>
						<td class="text-center"><b>NOME DA MÃE</b></td>
						<td class="text-center"><b>DATA DE NASCIMENTO</b></td>
						<td colspan="5" class="text-center"><b>APLICAÇÕES</b></td>					
					</tr>
				</thead>
				<tbody>
					<tr th:each="carteiraDeVacina : ${carteiraDeVacinas}" th:if="${not #lists.isEmpty(carteiraDeVacina.itens)}">

						<td th:text="${carteiraDeVacina.paciente.nome}"></td>
						<td th:text="${carteiraDeVacina.paciente.nomeDaMae}"></td>
						<td
							th:text="${#temporals.format(carteiraDeVacina.paciente.dataDeNascimento, 'dd/MM/yyyy')}"></td>
						<td>

							<table class="table table-striped mb-0">
								<thead>
									<tr>
										<td><b>Tipo de Vacina</b></td>										
										<td><b>Marca</b></td>
										<td><b>Nº do Lote</b></td>
										<td><b>Funcionário</b></td>
										<td><b>Data da aplicação</b></td>							
									</tr>
								</thead>
								<tbody>
									<tr th:each="doseVacinaItem : ${carteiraDeVacina.itens}">
										<td th:text="${doseVacinaItem.produtoEstoque.produto.nome}"></td>										
										<td	th:text="${doseVacinaItem.produtoEstoque.marca.getDescricao()}"></td>
										<td th:text="${doseVacinaItem.produtoEstoque.numeroDoLote}"></td>
										<td th:text="${doseVacinaItem.funcionario.nome}"></td>
										<td th:text="${#temporals.format(doseVacinaItem.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
									</tr>
								</tbody>
							</table>
						</td>
					</tr>
				</tbody>
			</table>
		</div>		
	</div>
	<script>
		var timeDisplay = document.getElementById("time");

		function refreshTime() {
			console.log("JavaScript carregado e executando!");
			var dateString = new Date().toLocaleString("pt-BR", {
				timeZone : "America/Sao_Paulo"
			});
			var formattedString = dateString.replace(", ", " - ");
			timeDisplay.innerHTML = formattedString;
		}

		setInterval(refreshTime, 1000);
	</script>
	<div th:replace="fragments/footer :: footer"></div>
</body>

</html>
