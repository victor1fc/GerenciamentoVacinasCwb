<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Sistema de Saúde</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
      <style>
         body {
           padding-top: 4.5rem;
         }
         .time {
         font-size: 1.0em;
         font-weight: bold;
         text-align: center;
         margin-bottom: 20px;
         color: white;
      }
      </style>
</head>
<body>
	<div th:replace="fragments/menu :: menu"></div>

   		<div class="container">
	      <div class="bg-light p-5 rounded">
			<h1>Pacientes</h1>
			<hr>
			<div>
				<a class="btn btn-primary" th:href="@{/pacientes/novo}">Novo</a>
			</div>
			<hr>
			<div th:if="${!#strings.isEmpty(feedback)}"
				 class="alert alert-success" role="alert">
				<span th:text="${feedback}"></span>
			</div>
			<table class="table table-hover">
			    <thead>
			        <tr>
			            <td><b>NOME</b></td>
			            <td><b>DATA NASCIMENTO</b></td>
			            <td><b>CPF</b></td>
						<td></td>
						<td></td>
			        </tr>
			    </thead>
			    <tbody>
			        <tr th:each="paciente : ${pacientes}">
			            <td th:text="${paciente.nome}"></td>
			            <td th:text="${#temporals.format(paciente.dataDeNascimento, 'dd/MM/yyyy')}"></td>
			            <td th:text="${paciente.cpf}"></td>
			            <td>
			            	<a class="btn btn-sm btn-secondary" th:href="@{/pacientes/edita/{id}(id=${paciente.id})}">Editar</a>
			            </td>
			            <td>			            	
			            	<a class="btn btn-sm btn-danger" th:href="@{/pacientes/deleta/{id}(id=${paciente.id})}">Remover</a>
			            </td>
			       </tr>
			     </tbody>
			</table>
		</div>
	</div>
	<script>
      var timeDisplay = document.getElementById("time");

      function refreshTime() {
         console.log("JavaScript carregado e executando!");
         var dateString = new Date().toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo" });
         var formattedString = dateString.replace(", ", " - ");
         timeDisplay.innerHTML = formattedString;
      }

      setInterval(refreshTime, 1000);
   </script>
</body>
<div th:replace="fragments/footer :: footer"></div>
</html>
