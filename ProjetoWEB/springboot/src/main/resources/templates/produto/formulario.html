<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Sistema de Saúde</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<style>
		body {
			padding-top: 4.5rem;
		}
		.time {
         font-size: 1.0em;
         font-weight: bold;
         text-align: center;
         margin-bottom: 20px;
         color: white;
      }
    </style>
</head>
<body>
   <div th:replace="fragments/menu :: menu"></div>
	<div class="container">
		<div class="bg-light p-5 rounded">
			<h1>Dados da Vacina</h1>
			<hr>
			<div>
				<form th:action="@{/produtos}" th:object="${produto}" method="POST">
					<input id="ativo" type="hidden" th:field="*{id}"/>
					 <div th:if="${mensagemErro}" class="alert alert-warning" role="alert">
   					 	<i class="bi bi-exclamation-triangle-fill"></i>
   					 	<span th:text="${mensagemErro}"></span>
					</div>
					<div class="mb-3 form-check form-switch">
						<label class="form-check-label" for="ativo">Registro ativo</label>
						<input class="form-check-input" role="switch" id="ativo" type="checkbox" th:field="*{ativo}"/>
					</div>
					<div class="row">
						<div class="col-3 mb-3">
							<label class="form-label" for="nome">Nome</label>
							<input class="form-control" id="nome" type="text" th:field="*{nome}"/>
							<span style="color: red" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
						</div>	
						<div class="col-2 mb-3">
							<label class="form-label" for="doses">Número de aplicações</label>
							 <input class="form-control" id="doses" th:field="*{doses}" type="number" min= "1" max="5"/>
							<span style="color: red" th:if="${#fields.hasErrors('doses')}" th:errors="*{doses}"></span>
						</div>
						<div class="col-3 mb-3">
							<label class="form-label" for="doseInterval">Intervalo entre as doses (em meses)</label>
							 <input class="form-control" id="doseInterval" th:field="*{doseInterval}" type="number"/>
							<span style="color: red" th:if="${#fields.hasErrors('doseInterval')}" th:errors="*{doseInterval}"></span>
						</div>
					</div>
					<div class="mb-3">
						<input class="btn btn-primary" type="submit" value="Salvar"/>
					</div>
				</form>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
			integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
			crossorigin="anonymous"></script>
			<script>
      var timeDisplay = document.getElementById("time");

      function refreshTime() {
         console.log("JavaScript carregado e executando!");
         var dateString = new Date().toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo" });
         var formattedString = dateString.replace(", ", " - ");
         timeDisplay.innerHTML = formattedString;
      }

      setInterval(refreshTime, 1000);
   </script>
  <div th:replace="fragments/footer :: footer"></div>
</body>

</html>
