<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Sistema de Saúde</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	<style>
        body {
          padding-top: 4.5rem;
        }
        .time {
         font-size: 1.0em;
         font-weight: bold;
         text-align: center;
         margin-bottom: 20px;
         color: white;
      }
    </style>
</head>
<body>
   <div th:replace="fragments/menu :: menu"></div>
	<div class="container">
		<div class="bg-light p-5 rounded">
			<h1>Vacinas</h1>
			<hr>
			<div>
				<a class="btn btn-primary" th:href="@{/produtos/novo}">Novo</a>
			</div>
			<hr>
			<div th:if="${!#strings.isEmpty(feedback)}" class="alert alert-success" role="alert">
				<span th:text="${feedback}"></span>
			</div>
			<table class="table table-hover">
				<thead>
					<tr>
						<td><b>NOME</b></td>
<!-- 						<td><b>MARCA</b></td> -->
						<td><b>NÚMERO DE APLICAÇÕES</b></td>
						<td><b>INTERVALO ENTRE DOSES (EM MESES)</b></td>
						<td></td>
					</tr>
			   </thead>
			   <tbody>
			       <tr th:each="produto : ${produtos}">
			           <td th:text="${produto.nome}"></td>
<!-- 			           <td th:text="${produto.marca.getDescricao()}"></td> -->
			           <td th:text="${produto.getDoses()}"></td>
			           <td th:text="${produto.getDoseInterval()}"></td>
			           <td>
			            <a class="btn btn-sm btn-secondary"
			               th:href="@{/produtos/edita/{id}(id=${produto.id})}">Editar</a>
			           </td>
			           <td>
				            <a class="btn btn-sm btn-secondary"
				               th:if="${produto.ativo == false}"
				               th:href="@{/produtos/ativa/{id}(id=${produto.id})}">Ativar</a>
				            <a class="btn btn-sm btn-secondary"
				               th:unless="${produto.ativo == false}"
				               th:href="@{/produtos/inativa/{id}(id=${produto.id})}">Inativar</a>
			           </td>
					</tr>
			    </tbody>
			</table>
		</div>
	</div>
	<script>
      var timeDisplay = document.getElementById("time");

      function refreshTime() {
         console.log("JavaScript carregado e executando!");
         var dateString = new Date().toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo" });
         var formattedString = dateString.replace(", ", " - ");
         timeDisplay.innerHTML = formattedString;
      }

      setInterval(refreshTime, 1000);
   </script>
   <div th:replace="fragments/footer :: footer"></div>
</body>

</html>
